# Builds OCCT, the Neon addon and the per-platform npm package on every supported platform,
# then runs the native and Caddy test suites against the freshly built artifact. Tools and steps
# come from the mise configs; MISE_ENV=ci makes every task test the release build it packages.
# release.yml calls it to build the platform packages it publishes.
name: native

on:
    push:
        branches: [main]
    pull_request:
    workflow_dispatch:
    workflow_call:

env:
    MISE_ENV: ci

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - { os: macos-15, target: darwin-arm64 }
                    - { os: macos-15-intel, target: darwin-x64 }
                    - { os: ubuntu-24.04, target: linux-x64 }
                    - { os: ubuntu-24.04-arm, target: linux-arm64 }
                    - { os: windows-2022, target: win32-x64 }
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4

            # Installs the tools of every config root (Node, pnpm, Vite+, Rust, CMake, Ninja,
            # Python, uv).
            - uses: jdx/mise-action@v2

            # OCCT links the system fontconfig (and expat) for font enumeration on Linux.
            - name: Install fontconfig (Linux)
              if: runner.os == 'Linux'
              run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev

            - name: MSVC developer environment
              if: runner.os == 'Windows'
              uses: ilammy/msvc-dev-cmd@v1

            - name: Cache OCCT and FreeType build
              uses: actions/cache@v4
              with:
                  path: packages/occt-native/.occt/${{ matrix.target }}
                  key: occt-${{ matrix.target }}-${{ hashFiles('packages/occt-native/scripts/build-occt.ts', 'packages/occt-native/scripts/build-freetype.ts') }}

            - run: mise run install

            - name: Lint
              if: matrix.target == 'linux-x64'
              run: mise run check

            - name: Check the oracle fixtures and compatibility docs
              if: matrix.target == 'linux-x64'
              run: "mise run //reference/build123d:fixtures:check ::: //reference/build123d:compat:check"

            # Generating needs libclang; Xcode provides it on macOS.
            - name: Check generated bindings are current
              if: runner.os == 'macOS'
              run: mise run //packages/occt-native:bindings:check

            - run: "mise run test ::: //packages/occt-native:smoke"

            - name: Assemble the platform package
              run: mise run //packages/occt-native:package

            - uses: actions/upload-artifact@v4
              with:
                  name: occt-native-${{ matrix.target }}
                  path: packages/occt-native/npm/
