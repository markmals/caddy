[package]
name = "occt-bindgen"
version = "0.1.0"
edition = "2024"
license = "LGPL-2.1-only"
description = "Generates opencascade-sys cxx bridges from OCCT headers via libclang"
publish = false

[dependencies]
clang = { version = "2.1.0", features = ["runtime", "clang_10_0"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
