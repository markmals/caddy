monorepo_root = true

[monorepo]
config_roots = ["packages/caddy", "packages/occt-native", "reference/build123d", "examples"]

[plugins]
vite-plus = "https://github.com/markmals/mise-vite-plus"

# Shared by every project. The Cargo workspace lives at the repository root, so Rust is declared
# here; the OCCT build tools and the Python oracle belong to their own projects.
[tools]
node = "26"
pnpm = "12.15.0"
vite-plus = "1.4.0"
rust = { version = "1.99.1", profile = "minimal", components = ["clippy", "rustfmt"] }

[env]
NODE_ENV = { default = "development" }
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.install]
description = "Install the JavaScript workspace"
run = "pnpm install"

[tasks.setup]
description = "Prepare a fresh checkout: dependencies, the Python oracle, OCCT and the addon"
depends = [":install", "//reference/build123d:install", "//packages/occt-native:build"]

[tasks.check]
description = "Format, lint and type-check TypeScript, Markdown and Rust"
depends = ["//packages/occt-native:lint"]
run = "vp check"

[tasks.fmt]
description = "Format TypeScript, Markdown and Rust in place"
depends = ["//packages/occt-native:fmt"]
run = "vp fmt"

[tasks.test]
description = "Run every Vitest suite against the staged addon"
depends = ["//packages/occt-native:build"]
run = "vp test run"

[tasks.ci]
description = "Everything CI verifies on one platform"
depends = [
    ":check",
    ":test",
    "//packages/occt-native:bindings:check",
    "//packages/occt-native:smoke",
    "//reference/build123d:fixtures:check",
    "//reference/build123d:compat:check",
    "//examples:all",
]

[tasks."release:pack"]
description = "Pack a release into .release/ from the platform packages in packages/occt-native/npm"
depends = ["//packages/occt-native:pack", "//packages/caddy:pack"]
run = "node scripts/release/pack.ts"

[tasks."release:publish"]
description = "Publish .release/ to npm, platform packages first; already-published versions are skipped"
run = "node scripts/release/publish.ts"
