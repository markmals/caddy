monorepo_root = true

[monorepo]
config_roots = []

[plugins]
vite-plus = "https://github.com/markmals/mise-vite-plus"

[tools]
node = "26"
pnpm = "12"
vite-plus = "latest"
python = "3.14"
uv = "latest"

[env]
NODE_ENV = { default = "development" }

_.path = ["{{config_root}}/node_modules/.bin"]
_.python.venv = { path = ".venv", create = true }

